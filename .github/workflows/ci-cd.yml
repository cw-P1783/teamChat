name: Workshop CI and Vercel Deploy

on:
  pull_request:
    branches: [develop, main, 'release/**']
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workshop-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: workshop-ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_BUILD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check

  deploy:
    name: deploy
    needs: ci
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
      url: ${{ steps.vercel.outputs.url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm ci
      - name: Build and deploy to Vercel
        id: vercel
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          NEXT_PUBLIC_BUILD_SHA: ${{ github.sha }}
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          set -euo pipefail
          for secret_name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [[ -z "${!secret_name}" ]]; then
              echo "::error::Add ${secret_name} to repository Actions secrets. See README.md."
              exit 1
            fi
          done

          if [[ "$GITHUB_REF" == 'refs/heads/main' ]]; then
            npx --no-install vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
            npx --no-install vercel build --prod --token="$VERCEL_TOKEN"
            DEPLOY_URL=$(npx --no-install vercel deploy --prebuilt --prod --yes \
              --meta githubCommitRef="$GITHUB_REF_NAME" --meta githubCommitSha="$GITHUB_SHA" \
              --token="$VERCEL_TOKEN")
          else
            npx --no-install vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
            npx --no-install vercel build --token="$VERCEL_TOKEN"
            DEPLOY_URL=$(npx --no-install vercel deploy --prebuilt --yes \
              --meta githubCommitRef="$GITHUB_REF_NAME" --meta githubCommitSha="$GITHUB_SHA" \
              --token="$VERCEL_TOKEN")
          fi

          [[ "$DEPLOY_URL" == https://* ]]
          printf 'url=%s\n' "$DEPLOY_URL" >> "$GITHUB_OUTPUT"
          printf '### Vercel deployment\n\n[Open deployment](%s)\n\nCommit: `%s`\n' \
            "$DEPLOY_URL" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
