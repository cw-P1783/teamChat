name: Team Chat PR Checks
"on": pull_request

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ci:
    name: workshop-ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_BUILD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Validate Production release version
        if: github.base_ref == 'main'
        env:
          RELEASE_HEAD: ${{ github.head_ref }}
          RELEASE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          test "$RELEASE_HEAD" = develop
          npm run version:check -- --base-ref "$RELEASE_BASE_SHA"
      - run: npm run check
